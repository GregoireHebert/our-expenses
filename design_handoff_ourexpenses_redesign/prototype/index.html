<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ours. — playful redesign</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0; padding: 0;
      background: #f5efe6;
      font-family: 'Geist', system-ui, -apple-system, sans-serif;
      color: #221f1c;
      min-height: 100vh;
      overflow-x: hidden;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      background:
        radial-gradient(circle at 12% 8%, oklch(0.92 0.06 65 / 0.55), transparent 38%),
        radial-gradient(circle at 88% 92%, oklch(0.9 0.07 25 / 0.45), transparent 42%),
        radial-gradient(circle at 78% 14%, oklch(0.93 0.05 150 / 0.4), transparent 38%),
        #f5efe6;
      display: flex; align-items: center; justify-content: center;
      padding: 40px 20px;
    }
    .stage {
      display: flex; flex-direction: column; align-items: center; gap: 18px;
    }
    .stage-label {
      font-family: 'Geist Mono', ui-monospace, monospace;
      font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
      color: oklch(0.5 0.04 60);
    }
    .stage-label b {
      color: oklch(0.32 0.05 35);
      font-weight: 600;
      margin-left: 4px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
